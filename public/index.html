<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="style.css">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script
	</head>

	<body>
		<h1>Fishing Game</h1>
		<button id="profile-button">Profile</button>
		<button id="fish-button"> Fish </button>
		<div class="fishing" >
		<div class="rod">
			<div class="reel">
			<div class="handle"></div>
			</div>
		</div>
		<div class="sea">
			<div class="area">
			<div class="bait" id="bait"></div>
			<div class="fish" >🐟</div>
			</div>
		</div>
		<div class="progress">
			<div class="area">
			<div class="bar" style="height:0%"></div>
			</div>
		</div>
		</div>
		<div id="account-area">
			<p id="account-message"></p>

			<button id="login-button">Log In</button>
			<button id="register-button">Create Account</button>

			<button id="logout-button" hidden>Log Out</button>
		</div>
		<p id="result"></p>

		<div>
			<select id="lobby-select">
				<option value="Lobby 1">Lobby 1</option>
				<option value="Lobby 2">Lobby 2</option>
				<option value="Lobby 3">Lobby 3</option>
			</select>
			<button id="switch-lobby-button">Switch Lobby</button>
			<div id="player-count">Players in lobby: 0</div>
		</div>
		<ul id="messages"></ul>

		<button id="inventory-button">See Inventory</button>

		<table>
			<thead>
				<tr>
					<th>Fish ID</th>
					<th>Weight</th>
					<th>Value</th>
				</tr>
			</thead>
			<tbody id="inventory-table"></tbody>
		</table>

		<script src="websocket.js"></script>
		<script src="fishing.js"></script>
		<script src="inventory.js"></script>

	</body>
</html>

<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<link rel="stylesheet" href="style.css">
		<title>Fishing Game</title>
	</head>

	<body>
		<h1>Fishing Game</h1>

		<div class="fishing" >
		<div class="rod">
			<div class="reel">
			<div class="handle"></div>
			</div>
		</div>
		<div class="sea">
			<div class="area">
			<div class="bait" id="bait"></div>
			<div class="fish" ></i></div>
			</div>
		</div>
		<div class="progress">
			<div class="area">
			<div class="bar" style="height:0%"></div>
			</div>
		</div>
		</div>

		<button id="fish-button">Fish</button>

		<p id="result"></p>

		<button id="inventory-button">See Inventory</button>

		<table>
			<thead>
				<tr>
					<th>Fish ID</th>
					<th>Weight</th>
					<th>Value</th>
				</tr>
			</thead>
			<tbody id="inventory-table"></tbody>
		</table>

		<script src="fishing.js"></script>
		<script src="inventory.js"></script>
	</body>
</html>

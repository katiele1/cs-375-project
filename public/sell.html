<!doctype html>
<html>
	<head>
    <meta charset="utf-8" />
    <title>Sell A Fish</title>
    <link rel="stylesheet" href="style.css" />
</head>

	<body>

		<button id="back-button">Back to Game</button>
		<h1>Sell A Fish</h1>

		<div>
			<label for="sell-value">Sell For:</label>
			<input type="number" min="1" max="9999" id="sell-value" type="text" required />
			<select id="sell-dropdown"></select>
			<p></p>
		</div>

		<div>
			<button id="list-button">List on Market</button>
		</div>

		<p id="sell-message"></p>


		<script src="sell.js"></script>
	</body>
</html>

<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Profile</title>
		<link rel="stylesheet" href="style.css" />
	</head>

	<body>
		<h1>Player Profile</h1>

		<p><strong>Username:</strong> <span id="username"></span></p>
		<p><strong>Email:</strong> <span id="email"></span></p>
		<p><strong>Coins:</strong> <span id="coins"></span></p>
		<p><strong>Level:</strong> <span id="level"></span></p>
		<p><strong>Experience:</strong> <span id="experience"></span></p>

		<h2>Caught Fish</h2>

		<table>
			<thead>
				<tr>
					<th>Image</th>
					<th>Fish</th>
					<th>Rarity</th>
					<th>Weight</th>
					<th>Value</th>
					<th>Location</th>
				</tr>
			</thead>

			<tbody id="profile-fish-table"></tbody>
		</table>

		<button id="back-button">Back to Game</button>

		<script src="profile.js"></script>
	</body>
</html>
